<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="JamaKiss - Gel Íntimo Bienestar Natural">
  <defs>
    <!-- Fondo blanco puro -->
    <linearGradient id="ribbonMain" x1="0%" y1="50%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#F6CDD9" stop-opacity="0.1" />
      <stop offset="18%" stop-color="#EB94AE" stop-opacity="0.65" />
      <stop offset="42%" stop-color="#D44872" stop-opacity="0.82" />
      <stop offset="68%" stop-color="#B92551" stop-opacity="0.78" />
      <stop offset="86%" stop-color="#E589A6" stop-opacity="0.58" />
      <stop offset="100%" stop-color="#F8D7E2" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="ribbonSheen" x1="10%" y1="20%" x2="92%" y2="75%">
      <stop offset="0%" stop-color="#FCE3EB" stop-opacity="0.08" />
      <stop offset="30%" stop-color="#E97D9E" stop-opacity="0.5" />
      <stop offset="56%" stop-color="#A61842" stop-opacity="0.6" />
      <stop offset="78%" stop-color="#F1A5BD" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="hibiscusHeart" cx="50%" cy="54%" r="54%">
      <stop offset="0%" stop-color="#6F0724" />
      <stop offset="28%" stop-color="#A8133D" />
      <stop offset="56%" stop-color="#DB4571" stop-opacity="0.88" />
      <stop offset="78%" stop-color="#F4A5BC" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="leafLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B9C495" />
      <stop offset="55%" stop-color="#96A36D" />
      <stop offset="100%" stop-color="#74824E" />
    </linearGradient>

    <linearGradient id="leafRightGrad" x1="0%" y1="50%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#8B9862" />
      <stop offset="60%" stop-color="#A9B582" />
      <stop offset="100%" stop-color="#768451" />
    </linearGradient>
  </defs>

  <!-- Fondo blanco puro #FFFFFF -->
  <rect width="960" height="460" fill="#FFFFFF" />

  <!-- Cinta de seda acuarela rosada-carmesí fluyendo detrás del tallo -->
  <g id="watercolor-silk-ribbon">
    <!-- Capa base suave -->
    <path
      d="M 275 216
         C 330 184, 378 192, 422 214
         C 464 236, 512 222, 560 192
         C 604 164, 650 162, 688 188
         C 672 200, 646 205, 616 206
         C 572 208, 540 238, 496 248
         C 448 258, 404 246, 368 220
         C 340 200, 308 205, 275 216 Z"
      fill="url(#ribbonMain)"
    />
    <!-- Capa translúcida secundaria superior -->
    <path
      d="M 294 202
         C 344 176, 396 196, 444 218
         C 488 238, 536 212, 578 184
         C 618 158, 662 162, 694 196
         C 672 184, 636 178, 598 194
         C 554 214, 514 238, 466 238
         C 418 238, 374 202, 294 202 Z"
      fill="url(#ribbonSheen)"
    />
    <!-- Pliegue fino luminoso -->
    <path
      d="M 326 202 C 378 194, 424 230, 476 232 C 530 234, 576 184, 654 178"
      fill="none"
      stroke="#B21D49"
      stroke-opacity="0.34"
      stroke-width="2.2"
      stroke-linecap="round"
    />
    <path
      d="M 348 214 C 402 228, 460 250, 524 228 C 574 210, 622 188, 676 198"
      fill="none"
      stroke="#D96A8E"
      stroke-opacity="0.32"
      stroke-width="1.8"
      stroke-linecap="round"
    />
  </g>

  <!-- Tallo y hojas botánicas (verde salvia con tinta fina) -->
  <g id="botanical-stem-leaves" stroke="#3B2329" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tallo fino curvado -->
    <path
      d="M 476 186 C 468 208, 456 226, 444 248"
      fill="none"
      stroke="#4D3532"
      stroke-width="1.6"
    />
    <!-- Hoja izquierda apuntando arriba-izquierda -->
    <path
      d="M 451 232
         C 430 220, 412 198, 405 174
         C 428 180, 448 198, 453 226 Z"
      fill="url(#leafLeftGrad)"
      stroke-width="1.35"
    />
    <path d="M 451 229 C 436 212, 422 194, 408 178" fill="none" stroke-width="1.1" />
    <path d="M 437 212 L 424 206 M 429 202 L 421 193 M 441 215 L 444 204 M 433 204 L 436 194" fill="none" stroke-width="0.85" stroke-opacity="0.7" />

    <!-- Hoja derecha más pequeña apuntando derecha -->
    <path
      d="M 454 228
         C 470 214, 496 208, 522 214
         C 506 230, 480 236, 456 230 Z"
      fill="url(#leafRightGrad)"
      stroke-width="1.3"
    />
    <path d="M 456 229 C 476 224, 496 219, 517 215" fill="none" stroke-width="1.0" />
    <path d="M 474 224 L 484 216 M 490 220 L 500 214 M 482 224 L 494 227" fill="none" stroke-width="0.8" stroke-opacity="0.65" />
  </g>

  <!-- Flor de Jamaica / Hibisco (5 pétalos blancos con rubor carmesí central y venas finas) -->
  <g id="hibiscus-flower" transform="translate(486, 148)">
    <!-- Pétalo 1: Superior izquierdo -->
    <path
      d="M 0 0
         C -18 -14, -44 -26, -42 -48
         C -40 -62, -26 -64, -18 -58
         C -10 -66, 6 -60, 12 -46
         C 16 -32, 10 -14, 0 0 Z"
      fill="#FFFFFF"
      stroke="#3B2027"
      stroke-width="1.45"
      stroke-linejoin="round"
    />
    <!-- Pétalo 2: Superior derecho -->
    <path
      d="M 0 0
         C 4 -20, 16 -46, 38 -52
         C 52 -56, 62 -44, 58 -32
         C 66 -22, 58 -8, 42 -2
         C 28 3, 12 4, 0 0 Z"
      fill="#FFFFFF"
      stroke="#3B2027"
      stroke-width="1.45"
      stroke-linejoin="round"
    />
    <!-- Pétalo 3: Inferior derecho -->
    <path
      d="M 0 0
         C 18 -4, 44 -4, 58 10
         C 68 20, 64 34, 52 38
         C 48 48, 32 48, 20 38
         C 8 28, 2 14, 0 0 Z"
      fill="#FFFFFF"
      stroke="#3B2027"
      stroke-width="1.45"
      stroke-linejoin="round"
    />
    <!-- Pétalo 4: Inferior central -->
    <path
      d="M 0 0
         C 12 14, 24 34, 16 50
         C 10 62, -4 62, -12 56
         C -24 60, -34 48, -32 34
         C -30 20, -14 8, 0 0 Z"
      fill="#FFFFFF"
      stroke="#3B2027"
      stroke-width="1.45"
      stroke-linejoin="round"
    />
    <!-- Pétalo 5: Izquierdo -->
    <path
      d="M 0 0
         C -16 8, -42 16, -58 6
         C -70 -2, -68 -18, -58 -24
         C -62 -36, -48 -44, -34 -38
         C -20 -32, -8 -14, 0 0 Z"
      fill="#FFFFFF"
      stroke="#3B2027"
      stroke-width="1.45"
      stroke-linejoin="round"
    />

    <!-- Rubor acuarela carmesí en el corazón de la flor -->
    <ellipse cx="0" cy="2" rx="40" ry="34" fill="url(#hibiscusHeart)" />

    <!-- Venas botánicas delicadas saliendo del centro -->
    <g stroke="#5C162B" stroke-opacity="0.55" stroke-width="0.9" fill="none" stroke-linecap="round">
      <!-- Superior izq -->
      <path d="M -2 -4 C -10 -20, -20 -36, -32 -48" />
      <path d="M -1 -6 C -6 -22, -10 -38, -14 -52" />
      <path d="M -4 -3 C -16 -14, -26 -24, -36 -34" />
      <!-- Superior der -->
      <path d="M 3 -4 C 14 -18, 28 -30, 44 -40" />
      <path d="M 4 -2 C 18 -10, 34 -18, 48 -24" />
      <!-- Inferior der -->
      <path d="M 5 2 C 20 6, 36 12, 50 20" />
      <path d="M 4 4 C 16 14, 28 24, 38 34" />
      <!-- Inferior -->
      <path d="M 0 6 C 2 22, 4 36, 4 48" />
      <path d="M -3 5 C -10 20, -16 34, -20 44" />
      <!-- Izquierdo -->
      <path d="M -5 1 C -22 2, -40 0, -54 -6" />
      <path d="M -5 -2 C -20 -10, -34 -18, -48 -24" />
    </g>

    <!-- Centro oscuro de los pétalos -->
    <circle cx="0" cy="1" r="6" fill="#6F0825" fill-opacity="0.85" />

    <!-- Estambre largo característico del hibisco apuntando arriba-derecha -->
    <path
      d="M 1 0 C 12 -14, 28 -34, 46 -56"
      fill="none"
      stroke="#5C1227"
      stroke-width="2.1"
      stroke-linecap="round"
    />
    <!-- Filamentos y anteras (puntitos alrededor de la punta del estambre) -->
    <g fill="#7C1432" stroke="#5C1227" stroke-width="0.7">
      <circle cx="29" cy="-35" r="1.7" />
      <circle cx="34" cy="-31" r="1.6" />
      <circle cx="24" cy="-39" r="1.5" />
      <circle cx="35" cy="-42" r="1.8" />
      <circle cx="40" cy="-38" r="1.7" />
      <circle cx="31" cy="-47" r="1.6" />
      <circle cx="41" cy="-49" r="1.8" />
      <circle cx="46" cy="-44" r="1.7" />
      <circle cx="38" cy="-54" r="1.6" />
      <circle cx="48" cy="-52" r="1.9" />
      <circle cx="44" cy="-59" r="2.0" />
      <circle cx="51" cy="-57" r="2.0" />
      <circle cx="47" cy="-62" r="1.8" />
    </g>
  </g>

  <!-- Tipografía principal "JamaKiss" fiel al diseño original -->
  <g id="wordmark-jamakiss">
    <!-- "Jama" en carmesí profundo #961033 -->
    <text
      x="208"
      y="306"
      font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
      font-size="112"
      font-weight="500"
      letter-spacing="-2"
      fill="#961033"
    >Jama</text>

    <!-- "K" en ciruela rosado #833853 con cola elegante extendida hacia abajo-derecha -->
    <text
      x="522"
      y="306"
      font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
      font-size="112"
      font-weight="500"
      fill="#833853"
    >K</text>
    <!-- Trazo estilizado extra bajo la "K" como en el logo original -->
    <path
      d="M 594 303 C 608 326, 636 334, 656 318 C 660 315, 656 309, 650 312 C 636 320, 616 314, 604 298 Z"
      fill="#833853"
    />

    <!-- "ıss" sin punto en la i (el punto se reemplaza por un corazón exacto) -->
    <text
      x="608"
      y="306"
      font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
      font-size="112"
      font-weight="500"
      letter-spacing="-1"
      fill="#833853"
    >ıss</text>

    <!-- Corazón sólido sobre la letra "i" de Kiss -->
    <path
      d="M 624.5 236
         C 624.5 231, 618 227, 614 230.5
         C 610 234, 612.5 240, 624.5 249
         C 636.5 240, 639 234, 635 230.5
         C 631 227, 624.5 231, 624.5 236 Z"
      fill="#833853"
    />
  </g>

  <!-- Subtítulos limpios centrados -->
  <text
    x="480"
    y="354"
    text-anchor="middle"
    font-family="'Inter', 'Segoe UI', Arial, sans-serif"
    font-size="25"
    font-weight="500"
    letter-spacing="7"
    fill="#2C2224"
  >GEL ÍNTIMO</text>

  <text
    x="480"
    y="388"
    text-anchor="middle"
    font-family="'Inter', 'Segoe UI', Arial, sans-serif"
    font-size="23"
    font-weight="400"
    letter-spacing="6.5"
    fill="#2C2224"
  >BIENESTAR NATURAL</text>
</svg>

